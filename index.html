<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>训练日历</title>
<style>
:root{--ink:#1b1b1b;--mut:#777;--line:#e6e6e6;--bg:#fafafa;--gym:#e07b00;--run:#1f9d55;--swim:#1f6fd1;--plan:#8a8a8a;--sel:#111}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:var(--ink);background:var(--bg)}
main{max-width:760px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:20px;margin:6px 0 2px} h2{font-size:17px;margin:22px 0 8px} h3{font-size:15px;margin:14px 0 6px}
.mut{color:var(--mut);font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.card.today{border-color:#bbb}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;color:#fff}
.p-gym{background:var(--gym)}.p-run{background:var(--run)}.p-swim{background:var(--swim)}.p-plan{background:var(--plan)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{font-size:20px;display:block}
.month{margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;color:var(--mut);text-align:center}
.day{aspect-ratio:1/1;background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px;cursor:pointer;position:relative;font-size:12px}
.day.empty{background:transparent;border:none;cursor:default}
.day.isToday{border:2px solid var(--sel)}
.day.sel{outline:2px solid #f0b400}
.day .n{color:#555}
.dots{position:absolute;left:3px;right:3px;bottom:3px;display:flex;gap:2px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%}
.d-gym{background:var(--gym)}.d-run{background:var(--run)}.d-swim{background:var(--swim)}
.d-plan{border:1.5px dashed var(--plan);background:transparent}
.mk{position:absolute;top:2px;right:4px;font-size:10px;color:#999}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0;table-layout:fixed;word-break:break-word}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{background:#f4f4f4}
details{margin:6px 0} summary{cursor:pointer;color:#333}
.log{font-size:14px;overflow-x:auto} .card{overflow-wrap:anywhere} .log blockquote{margin:6px 0;padding:4px 10px;border-left:3px solid #ddd;color:#444}
.log table{font-size:12.5px} .log pre{white-space:pre-wrap;font-size:12px;background:#f5f5f5;padding:6px}
a{color:#1f5fbf}
#gate{max-width:360px;margin:18vh auto;padding:0 20px;text-align:center}
#gate input{width:100%;font-size:16px;padding:10px;border:1px solid #ccc;border-radius:8px;margin:12px 0}
#gate button{width:100%;font-size:16px;padding:10px;border:0;border-radius:8px;background:#111;color:#fff}
#err{color:#b32d2d;font-size:14px;min-height:20px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);margin:4px 0}
.legend span{display:flex;align-items:center;gap:4px}
</style></head><body>
<div id="gate">
  <h1>训练日历</h1>
  <input id="pw" type="password" placeholder="密码" autocomplete="current-password">
  <button id="go">打开</button>
  <div id="err"></div>
</div>
<main id="app" style="display:none"></main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const ki = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.s), iterations:ENC.it, hash:'SHA-256'},
    ki, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const d = b64(ENC.d);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, d);
  return JSON.parse(new TextDecoder().decode(pt));
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const WD = '日一二三四五六';
const CONF = {video:'视频确认', exact:'确定', anchor:'对话时间戳', chain:'推定', 'chain?':'推定'};

let D, byDate = {}, selected;

function index(){
  const add = (d, k, v) => ((byDate[d] ??= {gym:[],run:[],swim:[],other:[],plan:[],video:[],report:[]})[k]).push(v);
  D.sessions.forEach(s => s.date && add(s.date, 'gym', s));
  D.cardio.forEach(c => add(c.date, c.kind, c));
  D.plans.forEach(p => {                           // end 字段 = 一段时间的原则，区间内每天都挂上
    const e = p.end || p.date;
    for (let d = new Date(p.date+'T00:00'); iso(d) <= e; d.setDate(d.getDate()+1)) add(iso(d), 'plan', p);
  });
  D.videos.forEach(v => add(v.date, 'video', v));
  D.reports.forEach(r => add(r.date, 'report', r));
}

function stats(ym){
  let g=0, rk=0, sn=0, rn=0;
  for (const [d, x] of Object.entries(byDate)) if (d.startsWith(ym)) {
    g += x.gym.length; x.run.forEach(r => {rk += r.km; rn++}); sn += x.swim.length;
  }
  return `<div class="stats">
    <div class="stat"><b>${g}</b><span class="mut">次力量训练</span></div>
    <div class="stat"><b>${rk.toFixed(1)}</b><span class="mut">km 跑步（${rn} 次）</span></div>
    <div class="stat"><b>${sn}</b><span class="mut">次游泳</span></div></div>`;
}

function monthGrid(y, m, today){
  const first = new Date(y, m, 1), days = new Date(y, m+1, 0).getDate();
  let h = `<div class="month"><h3>${y} 年 ${m+1} 月</h3><div class="grid">` +
    [...WD].map(w => `<div class="dow">${w}</div>`).join('');
  for (let i=0; i<first.getDay(); i++) h += '<div class="day empty"></div>';
  for (let d=1; d<=days; d++){
    const k = `${y}-${pad(m+1)}-${pad(d)}`, x = byDate[k];
    let dots = '', mk = '';
    if (x){
      dots += x.gym.map(() => '<i class="dot d-gym"></i>').join('');
      dots += x.run.map(() => '<i class="dot d-run"></i>').join('');
      dots += x.swim.map(() => '<i class="dot d-swim"></i>').join('');
      if (x.plan.length && !x.gym.length) dots += '<i class="dot d-plan"></i>';
      mk = (x.video.length ? '▶' : '') + (x.report.length ? '◆' : '');
    }
    h += `<div class="day${k===today?' isToday':''}${k===selected?' sel':''}" data-d="${k}"><span class="n">${d}</span>` +
         (mk ? `<span class="mk">${mk}</span>` : '') + `<div class="dots">${dots}</div></div>`;
  }
  return h + '</div></div>';
}

function setTable(sets){
  if (!sets.length) return '';
  return '<table><tr><th>动作</th><th>重量</th><th>组×次</th><th>备注</th></tr>' + sets.map(s =>
    `<tr><td>${esc(s.exercise)}</td><td>${s.load_kg && s.load_kg !== '0' ? esc(s.load_kg)+' kg' : ''}</td>` +
    `<td>${esc(s.sets)}${s.reps ? ' × '+esc(s.reps) : ''}</td><td>${esc(s.note)}</td></tr>`).join('') + '</table>';
}

function detail(k){
  const x = byDate[k] || {gym:[],run:[],swim:[],other:[],plan:[],video:[],report:[]};
  const dt = new Date(k+'T00:00');
  let h = `<h2>${k}（周${WD[dt.getDay()]}）</h2>`;
  if (!Object.values(x).some(a => a.length)) return h + '<p class="mut">这天没有记录。</p>';
  x.plan.forEach(p => h += `<div class="card"><div class="row"><span class="pill p-plan">计划</span><b>${esc(p.focus)}</b>
      <span class="mut">${esc(p.status)}</span></div><div class="log">${p.html}</div>
      <a class="mut" href="${p.url}" target="_blank">在 GitHub 打开 md</a></div>`);
  x.gym.forEach(s => {
    h += `<div class="card"><div class="row"><span class="pill p-gym">${esc(s.sid)}</span><b>${esc(s.focus)}</b>
      <span class="mut">${esc(CONF[s.date_conf] || s.date_conf)}</span></div>`;
    if (s.feel_summary) h += `<p>${esc(s.feel_summary)}</p>`;
    h += setTable(s.sets);
    if (s.log_html) h += `<details><summary>训练日记（原话 + 分析）</summary><div class="log">${s.log_html}</div></details>`;
    h += '</div>';
  });
  [...x.run, ...x.swim, ...x.other].sort((a,b) => a.time.localeCompare(b.time)).forEach(c =>
    h += `<div class="card"><div class="row"><span class="pill p-${c.kind==='swim'?'swim':'run'}">${c.kind==='swim'?'游泳':'跑步'}</span>
      ${c.kind==='swim' ? '' : `<b>${c.km} km</b>`}<span>${esc(c.moving)}</span>${c.hr?`<span class="mut">平均心率 ${Math.round(c.hr)}</span>`:''}
      <span class="mut">${esc(c.time)} · ${esc(c.name)}</span></div></div>`);
  if (x.video.length){
    const nd = x.video.some(v => v.netdisk);
    const dir = `/apps/TuwinSync/训练视频/${k}`;
    h += `<div class="card"><b>视频 ${x.video.length} 段</b><div class="mut">` +
      x.video.map(v => `${esc(v.time)} ${esc(v.file)}${v.netdisk ? '' : ' <span style="color:#b32d2d">未上传</span>'}`).join('<br>') + '</div>' +
      (nd ? `<div class="mut">百度网盘：我的应用数据 › TuwinSync › 训练视频 › ${k}<br>
        <a href="https://pan.baidu.com/disk/main#/index?category=all&path=${encodeURIComponent(dir)}" target="_blank">在网盘打开这个文件夹</a></div>`
          : '<div class="mut">原片只在本地 <code>pullup/raw/</code></div>') + '</div>';
  }
  if (x.report.length) h += '<div class="card"><b>报告</b><br>' +
      x.report.map(r => `<a href="${r.url}" target="_blank">${esc(r.title)}</a> <span class="mut">${esc(r.path)}</span>`).join('<br>') + '</div>';
  return h;
}

function render(){
  const now = new Date(), today = iso(now);
  selected ??= today;
  const plan = D.plans.find(p => p.date === today || (p.end && p.date <= today && today <= p.end));
  const next = D.plans.filter(p => p.date > today).sort((a,b) => a.date.localeCompare(b.date))[0];
  let h = `<h1>训练日历</h1><div class="mut">数据更新于 ${esc(D.built)}</div>`;
  h += `<div class="card today"><div class="row"><b>今天 ${today}（周${WD[now.getDay()]}）</b></div>` +
       (plan ? `<div class="row"><span class="pill p-plan">计划</span><b>${esc(plan.focus)}</b></div><div class="log">${plan.html}</div>`
             : `<p class="mut">今天没有计划。${next ? `下一个：<a href="#" data-jump="${next.date}">${next.date} ${esc(next.focus)}</a>` : ''}</p>`) + '</div>';
  h += stats(today.slice(0,7));
  h += `<div class="legend"><span><i class="dot d-gym"></i>力量</span><span><i class="dot d-run"></i>跑步</span>
        <span><i class="dot d-swim"></i>游泳</span><span><i class="dot d-plan"></i>计划</span><span>▶ 视频</span><span>◆ 报告</span></div>`;
  const s = new Date(D.since+'T00:00'); const months = [];
  const last = new Date(Math.max(now, ...D.plans.map(p => new Date((p.end || p.date)+'T00:00'))));
  for (let y=s.getFullYear(), m=s.getMonth(); y<last.getFullYear() || (y===last.getFullYear() && m<=last.getMonth()); m===11 ? (y++, m=0) : m++) months.push([y,m]);
  h += months.reverse().map(([y,m]) => monthGrid(y, m, today)).join('');
  h += `<div id="detail">${detail(selected)}</div>`;
  $('app').innerHTML = h;
  document.querySelectorAll('.day[data-d]').forEach(el => el.onclick = () => { selected = el.dataset.d; render();
    $('detail').scrollIntoView({behavior:'smooth'}); });
  document.querySelectorAll('[data-jump]').forEach(el => el.onclick = e => { e.preventDefault(); selected = el.dataset.jump; render();
    $('detail').scrollIntoView({behavior:'smooth'}); });
}

async function submit(){
  const pw = $('pw').value.trim(); if (!pw) return;
  $('go').disabled = true; $('go').textContent = '解密中…'; $('err').textContent = '';
  try {
    D = await decrypt(pw); index();
    $('gate').style.display = 'none'; $('app').style.display = 'block'; render();
    try { localStorage.setItem('tk', pw); } catch(e) {}
  } catch(e) {
    $('err').textContent = '密码不对，再试一次';
    $('go').disabled = false; $('go').textContent = '打开'; $('pw').value = ''; $('pw').focus();
  }
}
$('go').onclick = submit;
$('pw').onkeydown = e => { if (e.key === 'Enter') submit(); };
// 手机上常开：记住密码，下次直接进
(async () => { try { const k = localStorage.getItem('tk'); if (k) { $('pw').value = k; await submit(); } } catch(e) {} })();
</script></body></html>
